<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshDig</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 390px; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      padding: 10px;
      background: #181818;
      color: #eaeaea;
      font: 12px/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    button, input { font: inherit; }
    button {
      min-width: 30px;
      min-height: 28px;
      padding: 3px 7px;
      border: 1px solid #444;
      border-radius: 5px;
      background: #252525;
      color: #ddd;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: #ff5500; color: #fff; }
    button:focus-visible, input:focus-visible { outline: 2px solid #ff9a55; outline-offset: 1px; }
    button:disabled, input:disabled { cursor: default; opacity: .42; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 22px;
      margin-bottom: 6px;
      border-bottom: 1px solid #303030;
      color: #ff7a32;
      font-weight: 700;
    }
    #recovery-status {
      max-width: 62%;
      overflow: hidden;
      color: #aaa;
      font-size: 10px;
      font-weight: 400;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #recovery-dig { min-width: 0; min-height: 22px; margin-left: auto; padding: 1px 6px; border-color: #ff5500; color: #ff9a55; font-size: 10px; }
    #recovery-dig.off { border-color: #555; color: #999; }
    .track-row { display: flex; min-width: 0; align-items: center; gap: 8px; }
    #recovery-art {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 4px;
      background: #282828;
      object-fit: cover;
    }
    .track-meta { min-width: 0; flex: 1; }
    #recovery-title, #recovery-artist {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #recovery-title { color: #fff; font-size: 14px; font-weight: 700; }
    #recovery-artist { margin-top: 3px; color: #aaa; }
    .upper-actions, .transport-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
    }
    .upper-actions button { min-height: 25px; padding: 2px 6px; font-size: 11px; }
    .upper-actions #recovery-station { color: #ff8750; }
    #recovery-status-badge {
      min-width: 0;
      max-width: 132px;
      overflow: hidden;
      border-color: #ff5500;
      color: #ff9a55;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #recovery-status-badge.off { border-color: #555; color: #999; }
    .transport-actions { justify-content: center; margin-top: 8px; }
    .transport-actions button { min-width: 36px; padding: 3px 6px; font-size: 17px; }
    .transport-actions #recovery-play { min-width: 48px; color: #ff8750; }
    .transport-actions #recovery-follow { font-size: 15px; }
    .timeline, .volume { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
    .time { width: 34px; color: #999; font-size: 10px; text-align: center; }
    .timeline input, .volume input { min-width: 0; flex: 1; accent-color: #ff5500; }
    .volume #recovery-mute { min-width: 30px; padding: 2px 4px; border: 0; background: transparent; }
    #recovery-volume-value { width: 34px; color: #aaa; font-size: 10px; text-align: right; }
    #recovery-fallback {
      min-height: 27px;
      margin-top: 7px;
      padding: 4px 6px;
      border-left: 2px solid #ff5500;
      background: #221b17;
      color: #bbb;
      font-size: 10px;
      line-height: 1.25;
    }
    .stale #recovery-fallback { color: #ffbd91; }
  </style>
</head>
<body>
  <div class="topline">
    <span id="recovery-heading">FreshDig</span>
    <button id="recovery-dig" data-recovery-action="dig" type="button"></button>
    <span id="recovery-status" aria-live="polite"></span>
  </div>

  <div class="track-row">
    <img id="recovery-art" alt="" aria-hidden="true">
    <div class="track-meta">
      <div id="recovery-title"></div>
      <div id="recovery-artist"></div>
      <div class="upper-actions">
        <button id="recovery-station" data-recovery-action="station" type="button"></button>
        <button id="recovery-later" data-recovery-action="later" type="button" aria-label=""></button>
        <button id="recovery-later-list" data-recovery-action="openLater" type="button"></button>
        <button id="recovery-hate" data-recovery-action="hate" type="button">🤬</button>
      </div>
    </div>
  </div>

  <div class="timeline">
    <span id="recovery-passed" class="time">0:00</span>
    <input id="recovery-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="">
    <span id="recovery-duration" class="time">0:00</span>
  </div>

  <div class="volume">
    <button id="recovery-mute" data-recovery-action="mute" type="button" aria-label="">🔊</button>
    <input id="recovery-volume" data-recovery-action="vol" type="range" min="0" max="100" step="1" value="80" aria-label="">
    <span id="recovery-volume-value">80%</span>
  </div>

  <div class="transport-actions">
    <button id="recovery-prev" data-recovery-action="prev" type="button"></button>
    <button id="recovery-play" data-recovery-action="play" type="button"></button>
    <button id="recovery-dislike" data-recovery-action="dislike" type="button"></button>
    <button id="recovery-like" data-recovery-action="like" type="button"></button>
    <button id="recovery-repost" data-recovery-action="repost" type="button"></button>
    <button id="recovery-add-pl" data-recovery-action="addPl" type="button"></button>
    <button id="recovery-follow" data-recovery-action="follow" type="button"></button>
  </div>

  <div id="recovery-fallback" role="note"></div>

  <script src="i18n.js"></script>
  <script src="recovery.js"></script>
</body>
</html>
