<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>FreshDig for SoundCloud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #181818;
      color: #eaeaea;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2e2e2e;
    }
    .header-title {
      font-size: 14px;
      font-weight: bold;
      color: #ff5500;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge {
      font-size: 10px;
      background: #282828;
      padding: 2px 6px;
      border-radius: 10px;
      color: #888;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-primary {
      width: 100%;
      padding: 8px;
      background: #242424;
      border: 1px solid #ff5500;
      color: #ff5500;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      transition: all 0.15s ease;
    }
    .btn-primary:hover {
      background: #ff5500;
      color: #fff;
    }
    .card {
      background: #202020;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    select {
      width: 100%;
      background: #141414;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 5px 6px;
      font-size: 11px;
      outline: none;
    }
    .sync-sub-btn {
      background: #2a2a2a;
      color: #ff7700;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      cursor: pointer;
    }
    .sync-card {
      border-left: 3px solid #e53935;
      background: #1d1515;
    }
    .sync-btn-group {
      display: flex;
      gap: 6px;
    }
    .sync-btn {
      flex: 1;
      padding: 6px 4px;
      background: #2a1818;
      border: 1px solid #e53935;
      color: #ff8a80;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sync-btn:hover {
      background: #e53935;
      color: #fff;
    }
    .sync-msg {
      font-size: 10px;
      color: #bbb;
      margin-top: 6px;
      display: none;
      line-height: 1.3;
    }
    .discovery-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .discovery-title {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #ffaa00;
    }
    .discovery-desc {
      display: block;
      font-size: 10px;
      color: #999;
      margin-top: 2px;
      line-height: 1.3;
    }
    #discovery-card.off {
      border-left-color: #555 !important;
    }
    #discovery-card.off .discovery-title {
      color: #888;
    }
    .switch {
      position: relative;
      flex: none;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 20px;
      transition: background 0.15s ease;
    }
    .switch .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    .switch input:checked + .slider {
      background: #ff5500;
    }
    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }
    .switch input:focus-visible + .slider {
      outline: 2px solid #ffaa00;
      outline-offset: 2px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #777;
      padding: 4px 8px;
      background: #141414;
      border-radius: 4px;
      border: 1px solid #282828;
    }
    .status-bar strong {
      color: #ddd;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      🎧 FreshDig <span style="font-size:10px; color:#ff7700; font-weight:normal;">v1.7.8</span>
    </div>
    <div class="badge" id="conn-badge">SoundCloud未接続</div>
  </div>

  <!-- アクションボタン列 -->
  <div style="display: flex; gap: 6px; margin-bottom: 10px;">
    <button id="btn-miniplayer" class="btn-primary" style="margin-bottom: 0; flex: 1;">
      🪟 ミニプレイヤー
    </button>
    <button id="btn-station" class="btn-primary" style="margin-bottom: 0; flex: 1; border-color: #00e676; color: #00e676;" title="現在再生中の曲のステーションを開始">
      📻 ステーション開始
    </button>
  </div>

  <!-- 音量コントロール -->
  <div class="card" style="border-left: 3px solid #00e676;">
    <div class="card-label">
      <span>🔊 音量コントロール</span>
      <span id="vol-display-text" style="font-size: 11px; color: #00e676; font-weight: bold;">80%</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
      <button id="btn-vol-mute" style="background: #2a2a2a; border: 1px solid #444; color: #eee; font-size: 14px; border-radius: 4px; padding: 2px 8px; cursor: pointer; min-width: 32px;" title="ミュート切替">🔊</button>
      <input type="range" id="vol-slider" min="0" max="100" value="80" step="1" style="flex: 1; accent-color: #ff5500; cursor: pointer; height: 6px;">
    </div>
  </div>

  <!-- 発掘モード ON/OFF -->
  <div class="card" id="discovery-card" style="border-left: 3px solid #ff5500;">
    <label class="discovery-row" for="discovery-toggle">
      <span>
        <span class="discovery-title">🔍 発掘モード</span>
        <span class="discovery-desc" id="discovery-desc">知っている曲（Likes・フォロー中・Dislike）を自動スキップ</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="discovery-toggle" checked>
        <span class="slider"></span>
      </span>
    </label>
  </div>

  <!-- 追加先プレイリスト -->
  <div class="card">
    <div class="card-label">
      <span>➕ ワンクリック追加先プレイリスト</span>
      <button id="sync-btn" class="sync-sub-btn">🔄 同期</button>
    </div>
    <select id="pl-select">
      <option value="">読み込み中...</option>
    </select>
  </div>

  <!-- Dislike プレイリスト連携 (エクスポート & インポート) -->
  <div class="card sync-card">
    <div class="card-label" style="color: #ff8a80; font-weight: bold;">
      <span>🚫 Dislike曲のプレイリスト連携</span>
    </div>
    <div class="sync-btn-group">
      <button id="btn-export-dislikes" class="sync-btn">📤 SCへ書き出し</button>
      <button id="btn-import-dislikes" class="sync-btn">📥 SCから読み込み</button>
    </div>
    <div id="dislike-sync-msg" class="sync-msg"></div>
  </div>

  <!-- 最小限のステータス情報 -->
  <div class="status-bar">
    <span>除外Likes: <strong id="stat-likes">-</strong></span>
    <span>除外Follow: <strong id="stat-followings">-</strong></span>
    <span>Dislike: <strong id="stat-dislikes">-</strong></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
