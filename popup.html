<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>FreshDig for SoundCloud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #181818;
      color: #eaeaea;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      row-gap: 6px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2e2e2e;
    }
    .header-title {
      font-size: 14px;
      font-weight: bold;
      color: #ff5500;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 100%;
      min-width: 0;
    }
    .lang-flags {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .lang-flag-btn {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 2px 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      outline: none;
    }
    .lang-flag-btn:hover {
      border-color: #ff5500;
      background: #2a2a2a;
    }
    .lang-flag-btn.active {
      border-color: #ff5500;
      background: rgba(255, 85, 0, 0.2);
      box-shadow: 0 0 4px rgba(255, 85, 0, 0.4);
    }
    .lang-flag-btn img {
      width: 16px;
      height: 11px;
      display: block;
      object-fit: cover;
      border-radius: 1px;
    }
    .badge {
      font-size: 10px;
      background: #282828;
      padding: 2px 6px;
      border-radius: 10px;
      color: #888;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-primary {
      width: 100%;
      padding: 8px;
      background: #242424;
      border: 1px solid #ff5500;
      color: #ff5500;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      transition: all 0.15s ease;
    }
    .btn-primary:hover {
      background: #ff5500;
      color: #fff;
    }
    .main-actions { margin-bottom: 10px; }
    #btn-miniplayer { min-height: 72px; font-size: 24px; padding: 16px 8px; margin-bottom: 6px; border-radius: 10px; }
    .list-tabs { display: flex; gap: 6px; margin-bottom: 6px; }
    .list-tabs #tab-later { min-width: 0; min-height: 48px; font-size: 15px; }
    .list-tabs #tab-hated, .list-tabs #tab-noplay { flex: 0 0 42px; font-size: 22px; }
    button:focus-visible, summary:focus-visible { outline: 2px solid #ffaa00; outline-offset: 2px; }
    .list-tab { flex:1; background:#2a2a2a; border:1px solid #444; color:#ccc; border-radius:4px; padding:4px; font-size:12px; cursor:pointer; }
    .list-tab.active { border-color:#ff5500; color:#ff7700; }
    .list-search { width:100%; box-sizing:border-box; background:#242424; border:1px solid #444; color:#eee; border-radius:4px; padding:4px 6px; font-size:12px; margin-bottom:4px; }
    .list-body { max-height:170px; overflow-y:auto; }
    .list-row { display:flex; align-items:center; gap:6px; padding:3px 0; border-bottom:1px solid #2a2a2a; font-size:12px; }
    .list-row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#ddd; }
    .list-row a.nm { color:#ff9a55; text-decoration:none; cursor:pointer; }
    .list-row .sub { font-size:10px; color:#888; }
    .list-row button { background:transparent; border:1px solid #666; color:#ccc; border-radius:4px; font-size:10px; padding:1px 5px; cursor:pointer; flex-shrink:0; }
    .list-empty { color:#777; font-size:11px; padding:4px 0; }
    .fresh-row { display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:11px; color:#bbb; margin-bottom:3px; }
    .fresh-n { width:70px; background:#242424; border:1px solid #444; color:#eee; border-radius:4px; font-size:11px; padding:1px 3px; }
    #advanced-details {
      border-color: #ff5500;
      border-left: 3px solid #ff5500;
    }
    #advanced-details > summary {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #ff8a00;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.25;
      list-style: none;
    }
    #advanced-details > summary::-webkit-details-marker { display: none; }
    #advanced-details > summary::after {
      content: '▸';
      color: #ff5500;
      font-size: 18px;
      line-height: 1;
    }
    #advanced-details[open] > summary::after { content: '▾'; }
    #advanced-details:focus-within {
      box-shadow: 0 0 0 2px rgba(255, 85, 0, 0.35);
    }
    .card {
      background: #202020;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    select {
      width: 100%;
      background: #141414;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 5px 6px;
      font-size: 11px;
      outline: none;
    }
    .sync-sub-btn {
      background: #2a2a2a;
      color: #ff7700;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      cursor: pointer;
    }
    .sync-card {
      border-left: 3px solid #e53935;
      background: #1d1515;
    }
    .sync-btn-group {
      display: flex;
      gap: 6px;
    }
    .sync-btn {
      flex: 1;
      padding: 6px 4px;
      background: #2a1818;
      border: 1px solid #e53935;
      color: #ff8a80;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sync-btn:hover {
      background: #e53935;
      color: #fff;
    }
    .sync-msg {
      font-size: 10px;
      color: #bbb;
      margin-top: 6px;
      display: none;
      line-height: 1.3;
    }
    .auto-mp-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #aaa;
      margin: -4px 0 2px;
      cursor: pointer;
    }
    .auto-mp-row input {
      accent-color: #1e88e5;
      margin: 0;
      cursor: pointer;
    }
    .auto-mp-status {
      display: inline-block;
      grid-column: 2;
      margin-left: 0;
      color: #69f0ae;
      font-size: 9px;
      font-weight: 600;
    }
    #auto-mp-text { flex: 1; min-width: 0; }
    .auto-mp-status.unsupported {
      color: #ffb300;
    }
    .auto-mp-note {
      margin: 0 0 10px 21px;
      color: #888;
      font-size: 9px;
      line-height: 1.35;
    }
    .auto-mp-note.unsupported {
      color: #ffb300;
    }
    .discovery-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      min-height: 48px;
    }
    .discovery-heading {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .discovery-title {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #ffaa00;
    }
    .discovery-status {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 7px;
      border: 1px solid #ff5500;
      border-radius: 10px;
      background: #ff5500;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    #discovery-card.off .discovery-status {
      border-color: #666;
      background: transparent;
      color: #999;
    }
    .discovery-desc {
      display: block;
      font-size: 11px;
      color: #999;
      margin-top: 2px;
      line-height: 1.3;
    }
    #discovery-card.off {
      border-left-color: #555 !important;
    }
    #discovery-card.off .discovery-title {
      color: #888;
    }
    .switch {
      position: relative;
      flex: none;
      width: 54px;
      height: 30px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 20px;
      transition: background 0.15s ease;
    }
    .switch .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    .switch input:checked + .slider {
      background: #ff5500;
    }
    .switch input:checked + .slider::before {
      transform: translateX(24px);
    }
    .switch input:focus-visible + .slider {
      outline: 2px solid #ffaa00;
      outline-offset: 2px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #777;
      padding: 4px 8px;
      background: #141414;
      border-radius: 4px;
      border: 1px solid #282828;
    }
    .status-bar strong {
      color: #ddd;
    }
    .rate-banner {
      background: linear-gradient(135deg, #2b1d0c 0%, #1c1510 100%);
      border: 1px solid #ff7700;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
      display: none;
    }
    .rate-banner-title {
      font-size: 11px;
      font-weight: bold;
      color: #ffaa00;
      margin-bottom: 4px;
    }
    .rate-banner-desc {
      font-size: 10px;
      color: #ccc;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .rate-banner-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-rate-primary {
      flex: 1;
      background: #ff5500;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-rate-secondary {
      background: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 10px;
      cursor: pointer;
    }
    .btn-rate-dismiss {
      background: transparent;
      color: #777;
      border: none;
      padding: 2px 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-rate-dismiss:hover {
      color: #fff;
    }
    .guide-link {
      width: 100%;
      margin-top: 8px;
      padding: 6px 8px;
      background: transparent;
      border: 1px solid #555;
      border-radius: 4px;
      color: #bbb;
      font-size: 10px;
      cursor: pointer;
    }
    .guide-link:hover {
      border-color: #ff7700;
      color: #ff9a55;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      🎧 FreshDig <span style="font-size:10px; color:#ff7700; font-weight:normal;">v2.14.0</span>
    </div>
    <div class="header-right">
      <div class="lang-flags" id="lang-flags" title="Language / 言語">
        <button type="button" class="lang-flag-btn" data-lang="auto" title="Auto (OS)">
          <img src="icons/flags/auto.svg" alt="Auto">
        </button>
        <button type="button" class="lang-flag-btn" data-lang="ja" title="日本語">
          <img src="icons/flags/jp.svg" alt="JA">
        </button>
        <button type="button" class="lang-flag-btn" data-lang="en" title="English">
          <img src="icons/flags/us.svg" alt="EN">
        </button>
        <button type="button" class="lang-flag-btn" data-lang="de" title="Deutsch">
          <img src="icons/flags/de.svg" alt="DE">
        </button>
        <button type="button" class="lang-flag-btn" data-lang="ru" title="Русский">
          <img src="icons/flags/ru.svg" alt="RU">
        </button>
        <button type="button" class="lang-flag-btn" data-lang="vi" title="Tiếng Việt" aria-label="Tiếng Việt">🇻🇳</button>
        <button type="button" class="lang-flag-btn" data-lang="es" title="Español" aria-label="Español">🇪🇸</button>
      </div>
      <div class="badge" id="conn-badge">SoundCloud未接続</div>
    </div>
  </div>

  <!-- レビュー促進バナー（ヘビーユーザーに1回だけ表示） -->
  <div id="rate-banner" class="rate-banner">
    <div class="rate-banner-title" id="rate-title">🌟 FreshDig で新しい音楽は見つかりましたか？</div>
    <div class="rate-banner-desc" id="rate-desc">この拡張機能がSoundCloud利用を促進すると思っていただけたら、Chromeストアで評価やご意見をお聞かせください！新しいアーティストの励みとなる機能を追加していきます。</div>
    <div class="rate-banner-actions">
      <button id="btn-rate-now" class="btn-rate-primary" type="button">⭐ レビューを書く</button>
      <button id="btn-rate-later" class="btn-rate-secondary" type="button">あとで</button>
      <button id="btn-rate-dismiss" class="btn-rate-dismiss" type="button">✕</button>
    </div>
  </div>

  <!-- アクションボタン列 -->
  <div class="main-actions">
    <button id="btn-miniplayer" class="btn-primary">
      📻 ミニプレイヤー
    </button>
  </div>
  <label class="auto-mp-row" id="auto-mp-label-wrapper" for="auto-mp-toggle">
    <input type="checkbox" id="auto-mp-toggle" checked aria-describedby="auto-mp-note">
    <span id="auto-mp-text">別のタブを開いたら、ブラウザの許可範囲でミニプレイヤーを表示</span>
    <span id="auto-mp-status" class="auto-mp-status" aria-live="polite"></span>
  </label>
  <div id="auto-mp-note" class="auto-mp-note"></div>

  <!-- 発掘モード ON/OFF -->
  <div class="card" id="discovery-card" style="border-left: 3px solid #ff5500;">
    <label class="discovery-row" for="discovery-toggle">
      <span>
        <span class="discovery-heading">
          <span class="discovery-title" id="label-discovery-title">🔍 発掘モード</span>
          <span class="discovery-status" id="discovery-status" aria-live="polite">ON</span>
        </span>
        <span class="discovery-desc" id="discovery-desc">知っている曲（Likes・フォロー中・Dislike）を自動スキップ</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="discovery-toggle" checked aria-describedby="discovery-desc discovery-status">
        <span class="slider"></span>
      </span>
    </label>
  </div>

  <!-- リスト（出禁の作者 / 後で聴く） -->
  <div class="card" id="lists-card">
    <div class="list-tabs">
      <button id="tab-later" class="list-tab active" type="button" aria-pressed="true" aria-controls="list-body">🧐 後で聴くリスト</button>
      <button id="tab-hated" class="list-tab" type="button" aria-pressed="false" aria-controls="list-body" aria-label="作者除外" title="作者除外">🤬</button>
      <button id="tab-noplay" class="list-tab" type="button" aria-pressed="false" aria-controls="list-body" aria-label="NoPlay" title="NoPlay">⏭️</button>
    </div>
    <input id="list-search" type="text" class="list-search" autocomplete="off">
    <div id="list-body" class="list-body" role="region" aria-labelledby="tab-later"></div>
    <button id="list-more" type="button" class="sync-sub-btn" style="display:none; width:100%; margin-top:4px;"></button>
  </div>

  <!-- Dig Config（閉じた状態） -->
  <details class="card" id="advanced-details">
    <summary id="label-advanced">⚙ Dig設定</summary>
    <div style="margin-top:8px;">
      <div id="fresh-box">
        <div id="fresh-title" style="font-size:12px; color:#ddd; margin-bottom:4px;"></div>
        <label class="fresh-row"><input type="checkbox" id="fresh-followers-on"><span id="fresh-followers-pre"></span><input type="number" min="0" id="fresh-followers-n" class="fresh-n"><span id="fresh-followers-post"></span></label>
        <label class="fresh-row"><input type="checkbox" id="fresh-tracks-on"><span id="fresh-tracks-pre"></span><input type="number" min="0" id="fresh-tracks-n" class="fresh-n"><span id="fresh-tracks-post"></span></label>
        <label class="fresh-row"><input type="checkbox" id="fresh-plays-on"><span id="fresh-plays-pre"></span><input type="number" min="0" id="fresh-plays-n" class="fresh-n"><span id="fresh-plays-post"></span></label>
        <label class="fresh-row"><input type="checkbox" id="fresh-age-on"><span id="fresh-age-pre"></span><input type="number" min="0" id="fresh-age-n" class="fresh-n"><span id="fresh-age-post"></span></label>
        <div id="fresh-hint" class="sync-msg" style="margin-top:4px;"></div>
      </div>
      <div id="dig-rules-box" style="margin-top:10px; border-top:1px solid #333; padding-top:8px;">
        <div id="dig-rules-title" style="font-size:12px; color:#ff9a55; font-weight:700; margin-bottom:4px;"></div>
        <label class="fresh-row"><input type="checkbox" id="dig-rule-following"><span id="dig-rule-following-label"></span></label>
        <label class="fresh-row"><input type="checkbox" id="dig-rule-hated"><span id="dig-rule-hated-label"></span></label>
        <label class="fresh-row"><input type="checkbox" id="dig-rule-later"><span id="dig-rule-later-label"></span></label>
        <label class="fresh-row"><input type="checkbox" id="dig-rule-liked"><span id="dig-rule-liked-label"></span></label>
        <label class="fresh-row"><input type="checkbox" id="dig-rule-noplay"><span id="dig-rule-noplay-label"></span></label>
        <div id="dig-rules-hint" class="sync-msg" style="margin-top:4px;"></div>
      </div>
      <label class="fresh-row" style="margin-top:8px; font-weight:700;">
        <input type="checkbox" id="heard-skip-on">
        <span id="heard-skip-label"></span>
      </label>
      <div id="heard-skip-hint" class="sync-msg" style="margin-top:4px;"></div>
    </div>
  </details>

  <!-- 最小限のステータス情報 -->
  <div class="status-bar">
    <span><span id="label-stat-likes">除外Likes</span>: <strong id="stat-likes">-</strong></span>
    <span><span id="label-stat-follows">除外Follow</span>: <strong id="stat-followings">-</strong></span>
    <span><span id="label-stat-dislikes">不再生</span>: <strong id="stat-dislikes">-</strong></span>
  </div>

  <!-- 追加先プレイリスト -->
  <div class="card" style="margin-top:10px;">
    <div class="card-label">
      <span id="label-target-pl">➕ ワンクリック追加先プレイリスト</span>
      <button id="sync-btn" class="sync-sub-btn">🔄 同期</button>
    </div>
    <select id="pl-select">
      <option value="">読み込み中...</option>
    </select>
  </div>

  <div class="card">
    <div class="sync-btn-group">
      <button id="btn-export-lists" class="sync-btn" type="button">📤 リスト書き出し</button>
      <button id="btn-import-lists" class="sync-btn" type="button">📥 読み込み</button>
    </div>
  </div>

  <div class="card">
    <button id="btn-open-heard" class="sync-btn" type="button" style="width:100%;">🎧 既聴曲履歴 / バックアップ</button>
  </div>

  <button id="btn-open-guide" class="guide-link" type="button">使い方 / Guide</button>

  <!-- 診断レポート保存（ポップアップ最下部） -->
  <div style="margin-top:8px;">
    <button id="btn-download-report" class="sync-btn" style="width:100%; font-size:11px;">📥 不具合レポート保存 (JSON)</button>
    <div id="log-hint" class="sync-msg" style="margin-top:4px;"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="freshdig_core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
