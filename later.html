<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshDig</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 280px;
      margin: 0;
      padding: 12px;
      overflow: hidden;
      background: #181818;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }
    h1 {
      flex: 1;
      margin: 0;
      color: #ff9a55;
      font-size: 15px;
    }
    button, input {
      font: inherit;
    }
    button {
      color: #eee;
      background: #252525;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover, button:focus-visible { border-color: #ff5500; }
    .close { width: 30px; height: 30px; font-size: 20px; line-height: 1; }
    #later-search {
      width: 100%;
      margin-bottom: 8px;
      padding: 7px 9px;
      color: #eee;
      background: #242424;
      border: 1px solid #444;
      border-radius: 4px;
    }
    #later-items {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 3px;
      overscroll-behavior: contain;
    }
    .later-row, .later-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 6px 0;
      border-bottom: 1px solid #333;
    }
    .later-row a, .later-row .name, .later-item a, .later-item .name {
      min-width: 0;
      overflow: hidden;
      color: #ffb36b;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .later-row a:hover, .later-row a:focus-visible, .later-item a:hover, .later-item a:focus-visible { text-decoration: underline; }
    .later-row time, .later-item time {
      color: #aaa;
      font-size: 12px;
      white-space: nowrap;
    }
    .later-remove {
      width: 28px;
      height: 28px;
      color: #ff9a55;
      font-size: 18px;
      line-height: 1;
    }
    .later-remove:disabled { cursor: wait; opacity: .55; }
    .empty, #later-status {
      color: #aaa;
      font-size: 12px;
    }
    #later-status { min-height: 16px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <header class="header">
    <h1 id="later-title">FreshDig</h1>
    <button id="later-close" class="close" type="button" aria-label="Close">×</button>
  </header>
  <input id="later-search" type="search" autocomplete="off" placeholder="Search">
  <main id="later-items" tabindex="0" role="list" aria-live="polite"></main>
  <p id="later-status" role="status" aria-live="polite"></p>
  <script src="i18n.js"></script>
  <script src="later.js"></script>
</body>
</html>
